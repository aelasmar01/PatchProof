# PatchProof-owned pytest configuration for the verifier image (PROJECT_SPEC.md 7.4).
# It is passed explicitly with -c; pack directories never supply pytest configuration.
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 is set by the runner, so only the plugins named here load.
[pytest]
addopts =
    -p patchproof_verifier.plugin
    -p no:cacheprovider
    -p no:doctest
    -p no:pastebin
    -p no:stepwise
    -p no:tmpdir
    --noconftest
    --strict-markers
    --strict-config
    --import-mode=importlib
python_files = test_*.py
python_classes = Test*
python_functions = test_*
xfail_strict = true
